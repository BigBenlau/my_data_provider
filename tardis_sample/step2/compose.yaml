# 每個主管動態建立相同映像的 worker；只有主管具有 Docker socket。
x-supervisor: &supervisor
  image: market-collector:local
  build:
    context: ..
    dockerfile: step2/Dockerfile
  restart: unless-stopped
  init: true
  stop_grace_period: 90s
  environment:
    TZ: Asia/Shanghai
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  binance:
    <<: *supervisor
    command: [python, /app/step2/01_collect.py, cluster, --exchange, binance, --output, /data, --host-output, '${DATA_ROOT:?set absolute DATA_ROOT}/binance']
    volumes:
      - '${DATA_ROOT:?set absolute DATA_ROOT}/binance:/data'
      - /var/run/docker.sock:/var/run/docker.sock
  bybit:
    <<: *supervisor
    command: [python, /app/step2/01_collect.py, cluster, --exchange, bybit, --output, /data, --host-output, '${DATA_ROOT:?set absolute DATA_ROOT}/bybit']
    volumes:
      - '${DATA_ROOT:?set absolute DATA_ROOT}/bybit:/data'
      - /var/run/docker.sock:/var/run/docker.sock
  okx:
    <<: *supervisor
    command: [python, /app/step2/01_collect.py, cluster, --exchange, okx, --output, /data, --host-output, '${DATA_ROOT:?set absolute DATA_ROOT}/okx']
    volumes:
      - '${DATA_ROOT:?set absolute DATA_ROOT}/okx:/data'
      - /var/run/docker.sock:/var/run/docker.sock
  coinbase:
    <<: *supervisor
    command: [python, /app/step2/01_collect.py, cluster, --exchange, coinbase, --output, /data, --host-output, '${DATA_ROOT:?set absolute DATA_ROOT}/coinbase']
    volumes:
      - '${DATA_ROOT:?set absolute DATA_ROOT}/coinbase:/data'
      - /var/run/docker.sock:/var/run/docker.sock
  upbit:
    <<: *supervisor
    command: [python, /app/step2/01_collect.py, cluster, --exchange, upbit, --output, /data, --host-output, '${DATA_ROOT:?set absolute DATA_ROOT}/upbit']
    volumes:
      - '${DATA_ROOT:?set absolute DATA_ROOT}/upbit:/data'
      - /var/run/docker.sock:/var/run/docker.sock
